<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#FAF6EF">
    <meta name="description" content="K-Connect — Guest relations prep tool for The Sands Khao Lak by Katathani.">
    <title>K-Connect · The Sands Khao Lak</title>

    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="K-Connect">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app" class="app" aria-live="polite"></div>

    <template id="tmpl-login">
        <section class="screen screen--login">
            <header class="brand">
                <div class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 40 40" width="40" height="40"><circle cx="20" cy="20" r="18" fill="none" stroke="currentColor" stroke-width="1"/><path d="M13 14 L27 20 L13 26 Z" fill="currentColor"/></svg>
                </div>
                <h1 class="brand-name">K-Connect</h1>
                <p class="brand-sub">The Sands Khao Lak <span class="dot">·</span> by Katathani</p>
            </header>

            <form id="loginForm" class="login-form" novalidate>
                <label class="field">
                    <span class="field-label">Staff email <span class="th">อีเมลพนักงาน</span></span>
                    <input type="email" id="loginEmail" class="input" autocomplete="username" required placeholder="name@katathani.com">
                </label>

                <label class="field">
                    <span class="field-label">PIN <span class="th">รหัส</span></span>
                    <input type="password" id="loginPin" class="input" inputmode="numeric" pattern="[0-9]{4,6}" maxlength="6" autocomplete="current-password" required placeholder="••••">
                </label>

                <label class="check">
                    <input type="checkbox" id="loginRemember" checked>
                    <span>Keep me signed in <span class="th">จดจำการเข้าสู่ระบบ</span></span>
                </label>

                <button type="submit" class="btn btn--primary">Sign in <span class="th">เข้าสู่ระบบ</span></button>
                <p class="hint">This is not a survey. It's a connection.<br><span class="th">ไม่ใช่แบบสำรวจ แต่คือการสร้างความสัมพันธ์</span></p>
            </form>
        </section>
    </template>

    <template id="tmpl-home">
        <section class="screen screen--home">
            <header class="topbar">
                <div class="topbar-left">
                    <p class="topbar-title">Good <span id="tod">day</span></p>
                    <p class="topbar-name" id="staffName">—</p>
                </div>
                <button class="icon-btn" id="signOutBtn" title="Sign out" aria-label="Sign out">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>
                </button>
            </header>

            <div class="home-center">
                <p class="home-prompt">Room number <span class="th">หมายเลขห้อง</span></p>
                <div class="room-display" id="roomDisplay" aria-live="polite">
                    <span class="room-digits" id="roomDigits">—</span>
                </div>

                <div class="keypad" role="group" aria-label="Numeric keypad">
                    <button class="key" data-k="1">1</button>
                    <button class="key" data-k="2">2</button>
                    <button class="key" data-k="3">3</button>
                    <button class="key" data-k="4">4</button>
                    <button class="key" data-k="5">5</button>
                    <button class="key" data-k="6">6</button>
                    <button class="key" data-k="7">7</button>
                    <button class="key" data-k="8">8</button>
                    <button class="key" data-k="9">9</button>
                    <button class="key key--ghost" data-k="clear" aria-label="Clear">Clear</button>
                    <button class="key" data-k="0">0</button>
                    <button class="key key--ghost" data-k="back" aria-label="Back">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9L3 12l6 7h12a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/><path d="m18 9-6 6"/><path d="m12 9 6 6"/></svg>
                    </button>
                </div>

                <button id="findBtn" class="btn btn--primary btn--wide" disabled>
                    Find Guest <span class="th">ค้นหาแขก</span>
                </button>

                <p class="home-hint">Try 101, 214, 308, 412, 501 for demo data.</p>
            </div>
        </section>
    </template>

    <template id="tmpl-loading">
        <section class="screen screen--loading">
            <div class="spinner" aria-hidden="true"></div>
            <p class="loading-text">Connecting to PMS… <span class="th">กำลังเชื่อมต่อ</span></p>
        </section>
    </template>

    <template id="tmpl-notfound">
        <section class="screen screen--notfound">
            <header class="topbar topbar--plain">
                <button class="icon-btn" data-nav="home" aria-label="Back">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                </button>
            </header>
            <div class="empty">
                <h2>No guest found</h2>
                <p class="th">ไม่พบข้อมูลแขก</p>
                <p class="muted" id="notfoundRoom">Room —</p>
                <button class="btn btn--primary" data-nav="home">Try again <span class="th">ลองใหม่</span></button>
            </div>
        </section>
    </template>

    <template id="tmpl-profile">
        <section class="screen screen--profile">
            <header class="topbar">
                <button class="icon-btn" data-nav="home" aria-label="Back">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                </button>
                <div class="topbar-room">
                    <span class="room-chip" id="roomChip">Room —</span>
                </div>
                <button class="icon-btn" id="refreshBtn" title="Refresh" aria-label="Refresh">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>
                </button>
            </header>

            <div class="profile-body" id="profileBody"></div>

            <div class="quicklog" id="quicklog">
                <div class="quicklog-row quicklog-row--primary">
                    <button class="btn btn--connect" id="btnConnect">
                        <span class="check-ring" aria-hidden="true"></span>
                        Connection made <span class="th">เชื่อมต่อแล้ว</span>
                    </button>
                </div>

                <div class="quicklog-row">
                    <p class="quicklog-label">Mood <span class="th">อารมณ์</span></p>
                    <div class="chip-row" id="moodRow">
                        <button class="chip" data-mood="happy">Happy</button>
                        <button class="chip" data-mood="neutral">Neutral</button>
                        <button class="chip" data-mood="followup">Needs follow-up</button>
                        <button class="chip chip--alert" data-mood="complaint">Complaint</button>
                    </div>
                </div>

                <div class="quicklog-row">
                    <p class="quicklog-label">Action taken <span class="th">การดำเนินการ</span></p>
                    <div class="chip-row" id="actionRow">
                        <button class="chip" data-action="v2">Upgrade V2</button>
                        <button class="chip" data-action="beverage">Beverage</button>
                        <button class="chip" data-action="lunch">Lunch</button>
                        <button class="chip" data-action="dinner">Dinner</button>
                        <button class="chip" data-action="gift">Gift</button>
                        <button class="chip" data-action="other">Other</button>
                    </div>
                </div>

                <div class="quicklog-row quicklog-row--note">
                    <label class="field">
                        <span class="field-label">Note <span class="th">บันทึก</span> <span class="muted">(optional, ≤ 30s voice)</span></span>
                        <div class="note-wrap">
                            <textarea id="noteInput" class="input input--area" rows="2" maxlength="400" placeholder="A quiet observation, a name to remember…"></textarea>
                            <button class="mic-btn" id="micBtn" title="Voice to text" aria-label="Voice to text">
                                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M19 11a7 7 0 0 1-14 0"/><path d="M12 18v3"/></svg>
                            </button>
                        </div>
                    </label>
                </div>

                <div class="quicklog-row">
                    <button class="btn btn--ghost" id="saveLogBtn">Save to K-Connect Record</button>
                </div>
            </div>

            <div class="toast" id="toast" role="status" aria-live="polite"></div>
        </section>
    </template>

    <script src="mock-data.js"></script>
    <script src="api.js"></script>
    <script src="app.js"></script>
</body>
</html>
